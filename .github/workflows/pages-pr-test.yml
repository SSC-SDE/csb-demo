name: pages pr test
on:
  push:
    branches: [demo/checked-add]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && printf '<html><body>pages pr test</body></html>\n' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "URL=${{ steps.deployment.outputs.page_url }}"
