name: CodeShouldBehave Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: csb-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: CodeShouldBehave
        uses: SSC-SDE/CodeShouldBehave@v0.7.0
        with:
          design: auto
          fail-on-incomplete: false
